<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Frase de Stan Lee sobre ideias, animada com diferentes fontes">
<defs>
<linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#04080f"/>
  <stop offset=".55" stop-color="#07121d"/>
  <stop offset="1" stop-color="#03070d"/>
</linearGradient>
<linearGradient id="qlineGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffd166" stop-opacity="0"/>
  <stop offset=".5" stop-color="#ffd166" stop-opacity=".9"/>
  <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="qvig" cx=".5" cy=".45" r=".8">
  <stop offset=".55" stop-color="#000" stop-opacity="0"/>
  <stop offset="1" stop-color="#000" stop-opacity=".4"/>
</radialGradient>
<pattern id="qscan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".55"/>
</pattern>
<filter id="qblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
</defs>
<style>
@keyframes qlineIn {
  0% { opacity: 0; transform: translateY(14px); }
  5%, 80% { opacity: 1; transform: translateY(0); }
  88%, 100% { opacity: 0; transform: translateY(0); }
}
@keyframes qkey { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
@keyframes qbar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes qfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes qscan { from { transform: translateY(0); } to { transform: translateY(230px); } }
.qline { animation: qlineIn 18s ease-out infinite; animation-fill-mode: both; will-change: opacity, transform; }
.qkey { animation: qkey 2.6s ease-in-out infinite; }
.qbar { transform-box: fill-box; transform-origin: left; animation: qbar 1.4s ease-out 3.6s both; will-change: transform; }
.qfloat { animation: qfloat 6s ease-in-out infinite; will-change: transform; }
.qscan { animation: qscan 9s linear infinite; }
</style>
<polygon points="0,16 16,0 1184,0 1200,16 1200,214 1184,230 16,230 0,214" fill="url(#qbg)" stroke="#ffd166" stroke-opacity=".28" stroke-width="2.5"/>
<ellipse cx="600" cy="120" rx="430" ry="82" fill="#ffd166" opacity=".05" filter="url(#qblur)"/>
<line x1="40" y1="42" x2="1160" y2="42" stroke="#ffd166" stroke-opacity=".12"/>
<circle cx="40" cy="27" r="3.5" fill="#ffd166"/>
<text x="54" y="31" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="2.5" fill="#ffd166" opacity=".85">// MINDSET</text>
<text x="1160" y="31" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="9" letter-spacing="2" fill="#7dd3fc" opacity=".6">KEEP CREATING</text>
<g class="qfloat" opacity=".12">
  <text x="48" y="118" font-family="Georgia, serif" font-size="140" fill="#ffd166">“</text>
  <text x="1152" y="224" text-anchor="end" font-family="Georgia, serif" font-size="140" fill="#ffd166">”</text>
</g>
<g class="qline" style="animation-delay:.2s">
  <text x="600" y="82" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="31" fill="#eafcff">Se você tem uma ideia,</text>
</g>
<g class="qline" style="animation-delay:1.4s">
  <text x="600" y="128" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="27" fill="#cfefff">que você<tspan dx="8" class="qkey" font-family="ui-monospace, Consolas, monospace" font-weight="700" fill="#00e5ff">genuinamente</tspan><tspan dx="8">acha boa,</tspan></text>
</g>
<g class="qline" style="animation-delay:2.6s">
  <text x="600" y="178" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-weight="700" font-size="30" fill="#ffd166" letter-spacing="1">não deixe ninguém<tspan dx="10" font-family="Georgia, serif" font-style="italic" font-weight="400" font-size="26" letter-spacing="0" fill="#eafcff">te convencer do contrário.</tspan></text>
  <rect class="qbar" x="360" y="190" width="480" height="2" fill="url(#qlineGrad)"/>
</g>
<g class="qline" style="animation-delay:3.4s">
  <text x="600" y="212" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="3" fill="#ffd166" opacity=".8">— STAN LEE</text>
</g>
<rect class="qscan" x="0" y="0" width="1200" height="2" fill="#00e5ff" opacity=".1"/>
<rect width="1200" height="230" fill="url(#qscan)" opacity=".12"/>
<rect width="1200" height="230" fill="url(#qvig)"/>
<path d="M16 42V16h28M1156 16h28v26M1184 188v26h-28M44 214H16v-26" fill="none" stroke="#00e5ff" stroke-opacity=".38" stroke-width="2"/>
</svg>