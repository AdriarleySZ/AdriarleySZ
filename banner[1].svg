<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/><stop offset=".55" stop-color="#14091a"/><stop offset="1" stop-color="#2a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7a18" stop-opacity=".85"/><stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffa14a"/><stop offset=".6" stop-color="#e8590c"/><stop offset="1" stop-color="#8a2a05"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e0"/><stop offset="1" stop-color="#ffb24a"/>
    </linearGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ff7a18" opacity=".25"/>
    </pattern>
    <style>
      .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:930px 200px}
      .float{animation:float 3.2s ease-in-out infinite}
      .spin{animation:spin 8s linear infinite;transform-origin:930px 200px}
      .dash{stroke-dasharray:14 12;animation:dash 2s linear infinite}
      .speed{animation:speed 1.6s linear infinite}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes dash{to{stroke-dashoffset:-52}}
      @keyframes speed{0%{transform:translateX(0);opacity:0}30%{opacity:.8}100%{transform:translateX(-260px);opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <!-- court lines -->
  <g fill="none" stroke="#ff7a18" stroke-width="3" opacity=".55" class="dash">
    <path d="M500 400 A 260 260 0 0 1 1160 400"/>
    <path d="M640 400 V250 H1020 V400"/>
  </g>
  <g fill="none" stroke="#ffcf8a" stroke-width="2" opacity=".35">
    <circle cx="830" cy="250" r="90"/>
  </g>
  <!-- speed lines -->
  <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6">
    <line class="speed" x1="1180" y1="70"  x2="1060" y2="70"/>
    <line class="speed" style="animation-delay:.4s" x1="1180" y1="130" x2="1020" y2="130"/>
    <line class="speed" style="animation-delay:.9s" x1="1180" y1="290" x2="1040" y2="290"/>
    <line class="speed" style="animation-delay:1.2s" x1="1180" y1="340" x2="1080" y2="340"/>
  </g>
  <!-- ball -->
  <g class="float">
    <circle class="pulse" cx="930" cy="200" r="150" fill="url(#glow)"/>
    <g class="spin">
      <circle cx="930" cy="200" r="78" fill="url(#ball)" stroke="#2b0d02" stroke-width="3"/>
      <path d="M852 200 H1008 M930 122 V278" stroke="#2b0d02" stroke-width="3" fill="none"/>
      <path d="M876 144 C910 180 910 220 876 256 M984 144 C950 180 950 220 984 256" stroke="#2b0d02" stroke-width="3" fill="none"/>
    </g>
  </g>
  <!-- big jersey number -->
  <text x="40" y="360" font-family="Impact,'Arial Black',sans-serif" font-size="330" fill="none" stroke="#ff7a18" stroke-width="3" opacity=".25">223</text>
  <!-- title -->
  <g font-family="Impact,'Arial Black',sans-serif">
    <text x="64" y="190" font-size="92" fill="#ff4d2e" opacity=".55" transform="translate(5,5)">EUSOUEU223</text>
    <text x="64" y="190" font-size="92" fill="url(#txt)" stroke="#2b0d02" stroke-width="2">EUSOUEU223</text>
    <text x="68" y="245" font-size="30" letter-spacing="8" fill="#ffb24a">DEV  •  HOOPER  •  BUILDER</text>
  </g>
  <g font-family="'Courier New',monospace" font-size="20" fill="#9fb4ff" opacity=".9">
    <text x="68" y="300">&gt; shooting for the clean code, every possession.</text>
  </g>
  <rect x="0" y="392" width="1200" height="8" fill="#ff7a18"/>
</svg>
